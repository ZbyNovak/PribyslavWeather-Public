<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1620">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Počasí Přibyslav</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      background: color-mix(in srgb, Canvas 92%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
    }
    h1 { margin: 0; font-size: 1.05rem; font-weight: 650; }
    #status { margin-top: 2px; font-size: .78rem; opacity: .72; }
    main { padding: 8px 0 calc(12px + env(safe-area-inset-bottom)); }
    a.dashboard-link { display: block; text-decoration: none; color: inherit; }
    #dashboard {
      display: block;
      width: 100%;
      height: auto;
      min-height: 40vh;
      object-fit: contain;
      background: color-mix(in srgb, CanvasText 4%, Canvas);
    }
    #error { display: none; padding: 24px 16px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Počasí Přibyslav</h1>
    <div id="status">Načítám poslední aktualizaci…</div>
  </header>
  <main>
    <a id="dashboardLink" class="dashboard-link" href="latest.png" target="_blank" rel="noopener">
      <img id="dashboard" src="latest.png" alt="Aktuální meteorologický přehled pro Přibyslav">
    </a>
    <div id="error">Aktuální dashboard zatím není k dispozici.</div>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const imageEl = document.getElementById('dashboard');
    const linkEl = document.getElementById('dashboardLink');
    const errorEl = document.getElementById('error');

    async function refresh() {
      let version = Date.now().toString();
      try {
        const response = await fetch(`status.json?t=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) {
          const data = await response.json();
          version = encodeURIComponent(data.published_at || data.generated_at || version);
          if (data.generated_at) {
            const d = new Date(data.generated_at);
            statusEl.textContent = `Aktualizováno ${d.toLocaleString('cs-CZ', { dateStyle: 'short', timeStyle: 'short' })}`;
          } else {
            statusEl.textContent = 'Aktuální přehled';
          }
        } else {
          statusEl.textContent = 'Aktuální přehled';
        }
      } catch {
        statusEl.textContent = 'Aktuální přehled';
      }

      const src = `latest.png?v=${version}`;
      imageEl.src = src;
      linkEl.href = src;
    }

    imageEl.addEventListener('error', () => {
      imageEl.style.display = 'none';
      errorEl.style.display = 'block';
    });

    refresh();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
